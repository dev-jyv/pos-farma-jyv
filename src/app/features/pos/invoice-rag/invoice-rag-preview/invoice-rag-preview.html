@if (isPdf()) {
  @if (frameUrl(); as src) {
    <iframe [src]="src" [title]="fileName()" class="min-h-[28rem] w-full flex-1 border-0"></iframe>
  }
} @else {
  <div class="flex min-h-0 flex-1 items-center justify-center overflow-auto p-3">
    <img [src]="url()" [alt]="fileName()" class="max-h-full max-w-full rounded-lg object-contain shadow-sm" />
  </div>
}
